apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: random-integers-docker-jvm
  namespace: jamie-burns0-dev
spec:
  workspaces:
  - name: workspace
  params:
  - name: local-appname
    type: string
    description: name of the deployed app, service and route
    default: random-integers-docker-jvm
  - name: git-url
    type: string
    description: git url of our project
    default: https://github.com/jamie-burns0/random-integers.git
  - name: git-revision
    type: string
    description: git revision
    default: main
  - name: image
    type: string
    description: name of our image
    default: default-route-openshift-image-registry.apps.rm2.thpm.p1.openshiftapps.com/jamie-burns0-dev/$(params.local-appname):latest
  - name: dockerfile
    type: string
    description: path to our dockerfile
    default: src/main/docker/Dockerfile.jvm
  tasks:

  - name: fetch
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: output
      workspace: workspace
    # runAfter:
    # - ...  
    params:
    - name: DELETE_EXISTING
      value: "true"
    - name: VERBOSE
      value: "false"
    - name: SSL_VERIFY
      value: "true"
    - name: URL
      value: $(params.git-url)
    - name: REVISION
      value: $(params.git-revision)
  
  - name: build
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: buildah
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: source
      workspace: workspace
    runAfter:
    - fetch
    params:
    - name: IMAGE
      value: $(params.image)
    - name: DOCKERFILE
      value: $(params.dockerfile)

  - name: deploy
    taskRef:
      resolver: cluster
      params:
      - name: name
        value: openshift-client
      - name: kind
        value: task
      - name: namespace
        value: openshift-pipelines
    runAfter:
    - build
    params:
    - name: SCRIPT
      value: |
        APP=$(params.local-appname) \
        oc create deployment $APP \
          --image=$(tasks.build.results.IMAGE_URL)@$(tasks.build.results.IMAGE_DIGEST) \
          --dry-run=client -o yaml | oc apply -f -
        oc set probe deploy/$APP --readiness \
          --get-url=http://:8080/q/health/ready \
          --initial-delay-seconds=2 --period-seconds=30
        oc set probe deploy/$APP --liveness \
          --get-url=http://:8080/q/health/live \
          --initial-delay-seconds=2 --period-seconds=30          
        oc rollout status deploy/$APP
        oc create service clusterip $APP \
          --tcp=8080:8080 --dry-run=client -o yaml | oc apply -f -
        oc create route edge $APP \
          --service=$APP \
          --insecure-policy=Redirect \
          --dry-run=client -o yaml | oc apply -f -
    
    