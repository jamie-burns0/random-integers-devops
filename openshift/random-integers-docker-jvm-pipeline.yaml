apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: random-integers-docker-jvm
  namespace: jamie-burns0-dev
spec:
  workspaces:
  - name: workspace
  params:
  - name: git-url
    type: string
    description: git url of our project
    default: https://github.com/jamie-burns0/random-integers.git
  - name: git-revision
    type: string
    description: git revision
    default: main
  - name: image
    type: string
    description: name of our image
    default: default-route-openshift-image-registry.apps.rm2.thpm.p1.openshiftapps.com/jamie-burns0-dev/random-integers-docker-jvm:latest
  - name: dockerfile
    type: string
    description: path to our dockerfile
    default: openshift/Dockerfile.jvm
  tasks:

  - name: fetch
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: output
      workspace: workspace
    # runAfter:
    # - ...  
    params:
    - name: DELETE_EXISTING
      value: "true"
    - name: VERBOSE
      value: "false"
    - name: SSL_VERIFY
      value: "true"
    - name: URL
      value: $(params.git-url)
    - name: REVISION
      value: $(params.git-revision)
  
  - name: build
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: buildah
      - name: namespace
        value: openshift-pipelines
    workspaces:
    - name: source
      workspace: workspace
    runAfter:
    - fetch
    params:
    - name: IMAGE
      value: $(params.image)
    - name: DOCKERFILE
      value: $(params.dockerfile)

  - name: deploy
    taskRef:
      resolver: cluster
      params:
      - name: name
        value: openshift-client
      - name: kind
        value: task
      - name: namespace
        value: openshift-pipelines
      - name: local-appname
        value: random-integers-docker-jvm
    runAfter:
    - build
    params:
    - name: SCRIPT
      value: |
        oc create deployment $(params.local-appname) \
          --image=$(tasks.build.results.IMAGE_URL)@$(tasks.build.results.IMAGE_DIGEST) \
          --dry-run=client -o yaml | oc apply -f -
        oc set probe deploy/$(params.local-appname) --readiness \
          --get-url=http://:8080/q/health/ready \
          --initial-delay-seconds=2 --period-seconds=30
        oc set probe deploy/$(params.local-appname) --liveness \
          --get-url=http://:8080/q/health/live \
          --initial-delay-seconds=2 --period-seconds=30          
        oc rollout status deploy/$(params.local-appname)
        oc create service clusterip $(params.local-appname) \
          --tcp=8080:8080 --dry-run=client -o yaml | oc apply -f -
        oc create route edge $(params.local-appname) \
          --service=$(params.local-appname) \
          --insecure-policy=Redirect \
          --dry-run=client -o yaml | oc apply -f -
    
    