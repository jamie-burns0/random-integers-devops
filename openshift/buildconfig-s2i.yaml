apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: random-integers
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: random-integers
spec:
  source:
    type: Git
    git:
      uri: git@github.com:jamie-burns0/random-integers.git
      ref: main
    sourceSecret:
      name: github-ssh
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/openjdk-21
  output:
    to:
      kind: ImageStreamTag
      name: random-integers:s2i
  triggers:
    - type: ConfigChange
